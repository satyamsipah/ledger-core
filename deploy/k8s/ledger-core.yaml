  labels:
    helm.sh/chart: ledger-core-0.1.0
    app.kubernetes.io/name: ledger-core
    app.kubernetes.io/instance: ledger-core
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # weight "0": runs before kafka-init's "1" and before every Deployment
    # (hooks run before the main install/upgrade proceeds at all). A Job
    # name is not unique across "helm upgrade" runs by default, so
