{"components":{"headers":{"IdempotentReplay":{"description":"Present and `true` when this response was replayed from a stored record rather than freshly executed.","schema":{"const":"true","type":"string"}}},"parameters":{"IdempotencyKey":{"description":"A UUID naming this logical operation.\n\nA UUID rather than any opaque string, because keys share a namespace\nWITHIN one authenticated principal: a client picking `order-1` would\ncollide with its own earlier `order-1`, and the second would be handed\nthe first's response. Two different principals may use the identical\nkey without either affecting the other -- the namespace is\n(principal, key), never key alone.\n\nRetry semantics, in the order they are decided:\n\n| Condition | Result |\n|---|---|\n| Same key, same body, original completed | `201` replay with `Idempotent-Replay: true` |\n| Same key, same body, original still running | `409` with `Retry-After` |\n| Same key, **different** body | `422` |\n| Same key, replay record expired (24h) | `409` -- refused, never re-executed |\n\nThe fingerprint covers the canonical request body (RFC 8785) plus the\nmethod and route, so a key reused across two endpoints is a `422` rather\nthan a wrong answer. Two bodies that differ only in whitespace, key\norder or number formatting are the same request.\n","in":"header","name":"Idempotency-Key","required":true,"schema":{"format":"uuid","type":"string"}}},"responses":{"BadRequest":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"The request could not be processed as sent: a missing or non-UUID\n`Idempotency-Key`, a body that is not JSON, or a reversal with no reason.\n"},"Conflict":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"A live idempotency lease holds this key (`Retry-After` says when it\nfrees), or the key already created a transaction whose stored response\nhas expired, or the transaction is already reversed.\n","headers":{"Retry-After":{"description":"Seconds to wait. Derived from the remaining lease, never a fixed guess.","schema":{"minimum":1,"type":"integer"}}}},"InternalError":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Something failed on our side. `detail` is omitted deliberately -- a\nconstraint or table name in a public error body is free reconnaissance.\nQuote `request_id` when reporting it.\n"},"NotFound":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"No such account or transaction."},"Unavailable":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"The request exceeded its deadline and was abandoned, so its outcome is\nunknown. Retry with the SAME idempotency key: if the transaction did in\nfact commit, the retry replays it rather than posting a second one.\n","headers":{"Retry-After":{"schema":{"minimum":1,"type":"integer"}}}},"UnprocessableEntity":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"The request was understood and refused: the transaction does not\nbalance, an account has insufficient funds, or this idempotency key was\nalready used with a different body.\n"}},"schemas":{"Account":{"properties":{"account_type":{"$ref":"#/components/schemas/AccountType"},"allow_negative":{"type":"boolean"},"created_at":{"format":"date-time","type":"string"},"currency":{"pattern":"^[A-Z]{3}$","type":"string"},"external_ref":{"type":"string"},"id":{"format":"uuid","type":"string"},"normal_balance":{"$ref":"#/components/schemas/Direction"},"owner_id":{"type":"string"},"status":{"$ref":"#/components/schemas/AccountStatus"},"updated_at":{"format":"date-time","type":"string"}},"required":["id","external_ref","account_type","normal_balance","currency","allow_negative","status","created_at","updated_at"],"type":"object"},"AccountList":{"description":"One keyset-paginated page from GET /v1/accounts.","properties":{"accounts":{"items":{"$ref":"#/components/schemas/Account"},"type":"array"},"next_cursor":{"description":"Null on the last page. Opaque; pass it back as `cursor`.","type":["string","null"]}},"required":["accounts","next_cursor"],"type":"object"},"AccountStatus":{"description":"Only ACTIVE accounts may be posted to.","enum":["ACTIVE","FROZEN","CLOSED"],"type":"string"},"AccountType":{"enum":["ASSET","LIABILITY","EQUITY","REVENUE","EXPENSE"],"type":"string"},"Balance":{"properties":{"account_id":{"format":"uuid","type":"string"},"available":{"$ref":"#/components/schemas/Money"},"pending":{"$ref":"#/components/schemas/Money"},"updated_at":{"format":"date-time","type":"string"},"version":{"description":"Monotonic per account, bumped on every balance change. Consumers of\nthe event stream use it to discard a redelivered event, since outbox\ndelivery is at-least-once.\n","format":"int64","type":"integer"}},"required":["account_id","available","version","updated_at"],"type":"object"},"BalanceAsOf":{"properties":{"account_id":{"format":"uuid","type":"string"},"as_of":{"description":"Echoed back, because the answer is bounded-stale and it must be clear which question was answered.","format":"date-time","type":"string"},"balance":{"$ref":"#/components/schemas/Money"}},"required":["account_id","as_of","balance"],"type":"object"},"Direction":{"description":"Which side of the journal an entry falls on. Sign lives here, never in the amount.","enum":["DEBIT","CREDIT"],"type":"string"},"Entry":{"properties":{"account_id":{"format":"uuid","type":"string"},"amount":{"$ref":"#/components/schemas/Money"},"created_at":{"format":"date-time","type":"string"},"direction":{"$ref":"#/components/schemas/Direction"},"entry_seq":{"description":"Position within the transaction, numbered from zero in submission order.","type":"integer"},"id":{"format":"uuid","type":"string"}},"required":["id","account_id","direction","amount","entry_seq","created_at"],"type":"object"},"EntryRequest":{"additionalProperties":false,"properties":{"account_id":{"format":"uuid","type":"string"},"amount":{"$ref":"#/components/schemas/Money"},"direction":{"$ref":"#/components/schemas/Direction"}},"required":["account_id","direction","amount"],"type":"object"},"Money":{"description":"An exact amount in the minor units of one currency. `amount` is a\nSTRING of minor units, never a JSON number -- see the API description\nfor why. `scale` is the ISO-4217 exponent and affects presentation only;\nit never enters arithmetic.\n","properties":{"amount":{"description":"Minor units as a decimal string. 1250 with scale 2 is 12.50.","examples":["1250"],"pattern":"^-?\\d+$","type":"string"},"currency":{"examples":["INR"],"pattern":"^[A-Z]{3}$","type":"string"},"scale":{"description":"Where the decimal point goes. Rejected if it disagrees with the currency.","examples":[2],"maximum":4,"minimum":0,"type":"integer"}},"required":["amount","currency"],"type":"object"},"PostTransactionRequest":{"additionalProperties":false,"description":"Unknown fields are rejected. A client sending `ammount` has made a typo\nthat would otherwise post a zero-amount transaction, and in a ledger the\nsilent interpretation of a misspelled field is a defect.\n","properties":{"entries":{"description":"Must sum to zero within a currency; all entries share one currency.","items":{"$ref":"#/components/schemas/EntryRequest"},"minItems":2,"type":"array"},"external_ref":{"description":"The caller's own reference, for support lookups.","type":"string"},"metadata":{"additionalProperties":true,"description":"Arbitrary JSON, carried and never interpreted.","type":"object"},"type":{"$ref":"#/components/schemas/TransactionType"}},"required":["type","entries"],"type":"object"},"Problem":{"description":"RFC 9457 problem detail. Every error response uses this shape.","properties":{"detail":{"description":"The specific cause, naming the account or entry at fault. Omitted on 5xx.","type":"string"},"instance":{"type":"string"},"request_id":{"description":"Correlates this response with the server's logs and traces.","type":"string"},"status":{"type":"integer"},"title":{"type":"string"},"type":{"description":"Stable, machine-readable identifier for the failure. Switch on this\nrather than on `title` or `detail`, both of which are prose and may\nbe reworded. It names the problem and is not expected to resolve.\n","examples":["https://ledger-core.invalid/problems/insufficient-funds"],"format":"uri","type":"string"}},"required":["type","title","status"],"type":"object"},"ProblemType":{"description":"The complete set of machine-readable failure identifiers, without the\n`https://ledger-core.invalid/problems/` prefix. This list is the\ncontract: switch on it rather than on `title` or `detail`, which are\nprose and may be reworded without notice.\n\n`TestOpenAPI_DocumentsEveryProblemType` fails the build if the service\ncan emit an identifier that does not appear here, so the list cannot\nsilently fall behind the code.\n","enum":["account-not-found","account-not-postable","already-reversed","amount-overflow","canceled","currency-mismatch","idempotency-key-expired","idempotency-key-reused","invalid-api-key","missing-api-key","insufficient-funds","internal","invalid-currency","invalid-entry","invalid-idempotency-key","invalid-transaction-type","malformed-body","missing-idempotency-key","mixed-currency","reconciliation-run-not-found","request-in-progress","reversal-reason-required","saga-conflict","saga-not-found","scale-mismatch","timeout","too-few-entries","transaction-not-found","transaction-not-posted","unbalanced-transaction"],"type":"string"},"Readiness":{"properties":{"checks":{"additionalProperties":{"type":"string"},"description":"Dependency name to `ok` or the failure message.","type":"object"},"status":{"enum":["ready","not ready"],"type":"string"}},"type":"object"},"ReconciliationException":{"properties":{"category":{"enum":["MISSING_IN_LEDGER","MISSING_IN_PSP","AMOUNT_MISMATCH","STATUS_MISMATCH","TIMING_DIFFERENCE","DUPLICATE"],"type":"string"},"created_at":{"format":"date-time","type":"string"},"currency":{"type":"string"},"details":{"description":"Category-specific detail -- e.g. the PSP row count for a DUPLICATE, the computed gap for a TIMING_DIFFERENCE.","type":"object"},"external_ref":{"type":"string"},"id":{"format":"uuid","type":"string"},"ledger_amount_minor":{"description":"Sum of the matched transaction's DEBIT-side entries.","type":"integer"},"ledger_status":{"type":"string"},"ledger_transaction_id":{"format":"uuid","type":"string"},"psp_amount_minor":{"type":"integer"},"psp_status":{"type":"string"},"resolved_at":{"format":"date-time","type":"string"},"saga_id":{"format":"uuid","type":"string"},"status":{"enum":["OPEN","AUTO_RESOLVED","RESOLVED"],"type":"string"}},"required":["id","external_ref","category","status","created_at"],"type":"object"},"ReconciliationRun":{"properties":{"auto_resolved_count":{"description":"TIMING_DIFFERENCE findings closed automatically because the gap was inside the configured window.","type":"integer"},"by_category":{"additionalProperties":{"type":"integer"},"description":"Exception counts keyed by category, e.g. {\"AMOUNT_MISMATCH\": 2}.\nAbsent categories found none.\n","type":"object"},"error":{"description":"Populated only when status is FAILED.","type":"string"},"exception_count":{"type":"integer"},"exceptions":{"description":"Present on the single-run read.","items":{"$ref":"#/components/schemas/ReconciliationException"},"type":"array"},"finished_at":{"format":"date-time","type":"string"},"id":{"format":"uuid","type":"string"},"matched_count":{"description":"References where the ledger, the saga (if any) and the PSP statement agreed outright.","type":"integer"},"psp_row_count":{"type":"integer"},"source":{"description":"Where the PSP statement came from -- a file path in this deployment.","type":"string"},"started_at":{"format":"date-time","type":"string"},"status":{"enum":["RUNNING","COMPLETED","FAILED"],"type":"string"}},"required":["id","source","started_at","status","psp_row_count","matched_count","auto_resolved_count","exception_count"],"type":"object"},"ReconciliationRunList":{"properties":{"runs":{"items":{"$ref":"#/components/schemas/ReconciliationRun"},"type":"array"}},"required":["runs"],"type":"object"},"ReverseTransactionRequest":{"additionalProperties":false,"description":"The reason is required, not documentation. A reversal is the only way\nhistory is ever corrected, so an unexplained one is an audit hole.\n","properties":{"reason":{"examples":["chargeback: gateway reference gw_8f2a41"],"minLength":1,"type":"string"}},"required":["reason"],"type":"object"},"Saga":{"properties":{"attempts":{"description":"Present on the single-saga read. Every attempt, in order.","items":{"$ref":"#/components/schemas/SagaAttempt"},"type":"array"},"created_at":{"format":"date-time","type":"string"},"current_step":{"enum":["RESERVE","GATEWAY","SETTLE","DONE"],"type":"string"},"id":{"format":"uuid","type":"string"},"last_error":{"type":"string"},"retry_count":{"type":"integer"},"saga_type":{"type":"string"},"status":{"$ref":"#/components/schemas/SagaStatus"},"updated_at":{"format":"date-time","type":"string"}},"required":["id","saga_type","status","current_step","retry_count","created_at","updated_at"],"type":"object"},"SagaAttempt":{"properties":{"attempt":{"type":"integer"},"direction":{"enum":["FORWARD","COMPENSATION"],"type":"string"},"error":{"type":"string"},"finished_at":{"format":"date-time","type":"string"},"started_at":{"format":"date-time","type":"string"},"status":{"description":"`ATTEMPTED` with no `finished_at` is the write-ahead intent record,\ncommitted before the work began. On the gateway step it is the\ndurable evidence that a payment may exist under a known key.\n","enum":["ATTEMPTED","SUCCEEDED","FAILED"],"type":"string"},"step":{"enum":["RESERVE","GATEWAY","SETTLE"],"type":"string"},"transaction_id":{"description":"The ledger transaction this step posted. Absent for the gateway step, which posts none.","format":"uuid","type":"string"}},"required":["step","direction","attempt","status","started_at"],"type":"object"},"SagaList":{"properties":{"sagas":{"items":{"$ref":"#/components/schemas/Saga"},"type":"array"},"status":{"type":"string"}},"required":["status","sagas"],"type":"object"},"SagaStatus":{"description":"A saga's position in its state machine. Every value is a SETTLED state:\nthere is no \"in progress\" status, because a step commits its ledger\nentries and its transition together, so no crash can leave a saga\ndescribing itself as halfway through something.\n\n`GATEWAY_PENDING` is the one that matters operationally. It means the\ngateway's outcome is UNKNOWN -- still in flight, timed out, or the\norchestrator died mid-call, which are indistinguishable from here. The\nsaga resolves it by asking the gateway, never by assuming.\n\n`NEEDS_MANUAL_REVIEW` is terminal for automation only. The funds are\nheld in the suspense account and a person has to act.\n","enum":["PENDING","RESERVED","GATEWAY_PENDING","GATEWAY_SUCCEEDED","GATEWAY_FAILED","COMPENSATING","COMPLETED","COMPENSATED","FAILED","NEEDS_MANUAL_REVIEW"],"type":"string"},"StartPayoutRequest":{"properties":{"amount":{"$ref":"#/components/schemas/Money"},"customer_wallet_id":{"format":"uuid","type":"string"},"external_ref":{"type":"string"},"fee":{"allOf":[{"$ref":"#/components/schemas/Money"}],"description":"Optional, and must share the payout's currency and be strictly less\nthan it. Omitted or zero means no fee leg is posted at all -- a\nzero-amount journal entry is rejected by the schema.\n"},"fee_revenue_id":{"format":"uuid","type":"string"},"merchant_payable_id":{"format":"uuid","type":"string"},"platform_suspense_id":{"description":"Where the funds wait while the gateway is called. This account is\nwhat makes an unknown gateway outcome survivable: the money is out\nof the customer's wallet and not yet the merchant's, so it is owned\nby nobody and lost by nobody for as long as the ambiguity lasts.\n","format":"uuid","type":"string"}},"required":["customer_wallet_id","platform_suspense_id","merchant_payable_id","fee_revenue_id","amount"],"type":"object"},"Statement":{"properties":{"account_id":{"format":"uuid","type":"string"},"closing":{"$ref":"#/components/schemas/Money"},"currency":{"type":"string"},"from":{"format":"date-time","type":"string"},"lines":{"items":{"$ref":"#/components/schemas/StatementLine"},"type":"array"},"next_cursor":{"description":"Null on the last page. Opaque; pass it back as `cursor`.","type":["string","null"]},"opening":{"allOf":[{"$ref":"#/components/schemas/Money"}],"description":"The balance immediately before this page's first line -- not before\nthe requested period. On page three it is page two's closing\nbalance, so running totals stay continuous across pages.\n"},"to":{"format":"date-time","type":"string"}},"required":["account_id","currency","from","to","opening","closing","lines","next_cursor"],"type":"object"},"StatementLine":{"properties":{"entry":{"$ref":"#/components/schemas/Entry"},"running_balance":{"allOf":[{"$ref":"#/components/schemas/Money"}],"description":"The balance immediately after this entry, counted from `opening`."},"signed":{"allOf":[{"$ref":"#/components/schemas/Money"}],"description":"The entry amount in this account's own direction: positive when it\nincreases what the account holds, whatever the account's type. This\nis the only place in the API where a negative amount is legal.\n"}},"required":["entry","signed","running_balance"],"type":"object"},"Transaction":{"properties":{"created_at":{"format":"date-time","type":"string"},"entries":{"items":{"$ref":"#/components/schemas/Entry"},"type":"array"},"external_ref":{"type":"string"},"id":{"format":"uuid","type":"string"},"idempotency_key":{"format":"uuid","type":"string"},"metadata":{"additionalProperties":true,"type":"object"},"posted_at":{"description":"Set exactly when the transaction leaves PENDING.","format":"date-time","type":"string"},"status":{"$ref":"#/components/schemas/TransactionStatus"},"type":{"$ref":"#/components/schemas/TransactionType"}},"required":["id","type","status","created_at","entries"],"type":"object"},"TransactionList":{"description":"One keyset-paginated page from GET /v1/transactions.","properties":{"next_cursor":{"description":"Null on the last page. Opaque; pass it back as `cursor`.","type":["string","null"]},"transactions":{"items":{"$ref":"#/components/schemas/Transaction"},"type":"array"}},"required":["transactions","next_cursor"],"type":"object"},"TransactionStatus":{"enum":["PENDING","POSTED","REVERSED"],"type":"string"},"TransactionType":{"description":"`FX` is accepted by the schema but not reachable through this API yet:\nposting spans a single currency until exchange-rate handling exists.\n`REVERSAL` is produced by the reverse endpoint, not submitted.\n","enum":["TRANSFER","PAYIN","PAYOUT","FEE","FX","REVERSAL","ADJUSTMENT"],"type":"string"}},"securitySchemes":{"ApiKeyAuth":{"bearerFormat":"lk_live_\u003c64 hex characters\u003e","description":"A key minted by `cmd/issue-api-key`. Presented as\n`Authorization: Bearer \u003ckey\u003e`. Required on every write route.\n\nMost read routes take none -- `GET /v1/accounts/{id}/balance` and\n`.../statement` require already knowing the account's UUID, and there\nis no per-principal authorization model on this schema yet (see\ndocs/DECISIONS.md D47) for a key to usefully scope anyway. A handful of\nreads that would otherwise let any caller enumerate amounts, external\nreferences or the chart of accounts DO require it: reconciliation\nruns, transaction search and drill-down, and account search and\nlookup. Each documents this on its own operation.\n","scheme":"bearer","type":"http"}}},"info":{"description":"The write and read surface of a double-entry ledger.\n\nThree things about this API are unusual enough to state up front, because\neach is a deliberate constraint rather than an oversight.\n\n**Money is a string.** Every amount is a decimal string of *minor units*\n(paise, cents) plus an ISO-4217 code and its exponent. It is a string\nbecause JSON numbers become IEEE-754 doubles in JavaScript, which silently\nloses precision past 2^53 minor units -- so a ledger sending numbers\ncorrupts exactly its largest and most important rows. The API rejects a\nJSON number for an amount rather than accepting one that happens to round\ntrip today.\n\n**Writes require an Idempotency-Key.** Required, not optional: an optional\nkey is one a client forgets under precisely the conditions -- timeouts,\nretries, a partial outage -- that make it matter. Retrying a request with\nthe same key never creates a second transaction, at any level of\nconcurrency, and a retry after the original completed replays the stored\nresponse byte for byte with `Idempotent-Replay: true`.\n\n**Nothing is ever edited.** The journal is append-only. A mistake is\ncorrected by posting a reversal, which is a new transaction with mirrored\nlegs, so the ledger can always answer what it believed at any past instant.\n","license":{"name":"MIT"},"title":"Ledger-Core API","version":"0.4.0"},"openapi":"3.1.0","paths":{"/healthz":{"get":{"description":"Checks nothing on purpose. Liveness asks \"is this process wedged?\", and\nanswering it with a database ping means one slow query restarts every\nreplica at once. Dependency health belongs in readiness.\n","operationId":"getHealthz","responses":{"200":{"content":{"application/json":{"schema":{"properties":{"status":{"const":"ok","type":"string"}},"type":"object"}}},"description":"The process is running."}},"summary":"Liveness probe","tags":["health"]}},"/readyz":{"get":{"description":"Reports whether this instance can serve traffic, naming any dependency that failed.","operationId":"getReadyz","responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Readiness"}}},"description":"Ready."},"503":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Readiness"}}},"description":"Not ready. The `checks` map names what failed."}},"summary":"Readiness probe","tags":["health"]}},"/v1/accounts":{"get":{"description":"One keyset-paginated page of accounts, newest first, matching every\nfilter supplied. Sharded accounts never appear: a shard is internal\nrouting plumbing (see docs/DECISIONS.md D25), not a distinct\ncustomer-facing account.\n\n`external_ref` matches as a case-insensitive substring; `owner_id` and\n`currency` are exact matches. Requires authentication: an unauthenticated\nsearch would let any caller enumerate the whole chart of accounts,\nwhich already-knowing-a-UUID (`GET /v1/accounts/{id}/balance`) does not.\n","operationId":"searchAccounts","parameters":[{"in":"query","name":"external_ref","schema":{"type":"string"}},{"in":"query","name":"owner_id","schema":{"type":"string"}},{"in":"query","name":"currency","schema":{"pattern":"^[A-Z]{3}$","type":"string"}},{"description":"Page size. Clamped to 1000.","in":"query","name":"limit","schema":{"default":100,"maximum":1000,"minimum":1,"type":"integer"}},{"description":"The `next_cursor` from the previous page.","in":"query","name":"cursor","schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AccountList"}}},"description":"One page of matching accounts."},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Missing or invalid API key."},"422":{"$ref":"#/components/responses/UnprocessableEntity"}},"summary":"Search accounts","tags":["accounts"]}},"/v1/accounts/{id}":{"get":{"description":"An account's metadata -- not its balance; see `GET\n/v1/accounts/{id}/balance` for that. Requires authentication, for the\nsame reason the search above does.\n","operationId":"getAccount","parameters":[{"in":"path","name":"id","required":true,"schema":{"format":"uuid","type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Account"}}},"description":"The account."},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Missing or invalid API key."},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"No such account."}},"summary":"Read one account's metadata","tags":["accounts"]}},"/v1/accounts/{id}/balance":{"get":{"description":"Without `as_of`, returns the synchronous balance maintained inside the\nposting transaction under the account's row lock. This is the\nauthoritative figure -- the one the overdraft constraint is evaluated\nagainst -- not the Kafka-driven projection.\n\nWith `as_of`, recomputes the balance from the journal at an instant.\nThat answer is **bounded-stale by design**: journal entries are stamped\nwith transaction *start* time, so a query for 12:00:01 run at 12:00:02\nmisses a transaction that began at 12:00:00 and has not yet committed.\nThe answer becomes stable once no transaction older than the requested\ninstant is still in flight.\n","operationId":"getAccountBalance","parameters":[{"in":"path","name":"id","required":true,"schema":{"format":"uuid","type":"string"}},{"description":"RFC 3339 instant to reconstruct the balance at.","in":"query","name":"as_of","required":false,"schema":{"format":"date-time","type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/Balance"},{"$ref":"#/components/schemas/BalanceAsOf"}]}}},"description":"The balance."},"404":{"$ref":"#/components/responses/NotFound"},"422":{"$ref":"#/components/responses/UnprocessableEntity"},"500":{"$ref":"#/components/responses/InternalError"}},"summary":"Read an account's balance","tags":["accounts"]}},"/v1/accounts/{id}/statement":{"get":{"description":"Keyset-paginated, not offset-paginated. The journal is append-only and\nconstantly growing, so `OFFSET 50000` makes the database walk fifty\nthousand rows it then discards, and any entry inserted between two page\nrequests shifts every later offset by one -- so a client paging a busy\naccount both pays more per page and silently skips rows.\n\nFollow `next_cursor` to the next page. The cursor is opaque: it encodes\na `(created_at, id)` pair, because timestamps tie and paginating on the\ntimestamp alone would repeat or drop entries at a page boundary. Do not\nconstruct one.\n","operationId":"getAccountStatement","parameters":[{"in":"path","name":"id","required":true,"schema":{"format":"uuid","type":"string"}},{"description":"Start of the period. Defaults to 30 days ago.","in":"query","name":"from","schema":{"format":"date-time","type":"string"}},{"description":"End of the period. Defaults to now.","in":"query","name":"to","schema":{"format":"date-time","type":"string"}},{"description":"Page size. Clamped to 1000.","in":"query","name":"limit","schema":{"default":100,"maximum":1000,"minimum":1,"type":"integer"}},{"description":"The `next_cursor` from the previous page.","in":"query","name":"cursor","schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Statement"}}},"description":"One page, with a running balance continuous across pages."},"404":{"$ref":"#/components/responses/NotFound"},"422":{"$ref":"#/components/responses/UnprocessableEntity"},"500":{"$ref":"#/components/responses/InternalError"}},"summary":"Read one page of an account's history","tags":["accounts"]}},"/v1/payouts":{"post":{"description":"Begins a payout: the customer's wallet is debited into platform\nsuspense, an external gateway is called, and on success the merchant\npayable and fee revenue accounts are credited. On failure the reserve\nis compensated with a reversing transaction.\n\nReturns **202, not 201**. No money has moved when this returns; the\nsaga is queued and an orchestrator claims it. Poll `GET /v1/sagas/{id}`\nfor the outcome, or consume `SagaStepCompleted` from\n`ledger.events.saga`.\n\n`Idempotency-Key` is required, as on every write. It dedupes the whole\nsaga rather than a single transaction: retrying with the same key\nreturns the saga that was already started.\n","operationId":"startPayout","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StartPayoutRequest"}}},"required":true},"responses":{"202":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Saga"}}},"description":"The saga was accepted, or already existed under this key."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Missing or malformed idempotency key, or malformed body."},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"The payout is not representable -- unknown account, mixed currency, fee at or above the amount."}},"summary":"Start a marketplace payout saga","tags":["sagas"]}},"/v1/reconciliation/runs":{"get":{"description":"Newest first. cmd/reconciler produces these on a schedule (daily by\ndefault); this endpoint only reads what it already found. Requires\nauthentication, unlike the saga read routes -- a run's exceptions\ncarry amounts and external references, the class of information D24\nalready scopes idempotency responses to a principal to protect.\n","operationId":"listReconciliationRuns","parameters":[{"in":"query","name":"limit","required":false,"schema":{"default":100,"maximum":1000,"minimum":1,"type":"integer"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReconciliationRunList"}}},"description":"The most recent runs."},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Missing or invalid API key."},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"The limit is out of range."}},"summary":"List recent reconciliation runs","tags":["reconciliation"]}},"/v1/reconciliation/runs/{id}":{"get":{"description":"The daily report: the run's own counts, a breakdown by category, and\nthe full list of exceptions -- MISSING_IN_LEDGER, MISSING_IN_PSP,\nAMOUNT_MISMATCH, STATUS_MISMATCH, an unresolved TIMING_DIFFERENCE, or\nDUPLICATE. A TIMING_DIFFERENCE inside the configured window does not\nappear here as OPEN; it is included with `status: AUTO_RESOLVED`, so\nthe run's exception list always reconciles to `exception_count`.\n","operationId":"getReconciliationRun","parameters":[{"in":"path","name":"id","required":true,"schema":{"format":"uuid","type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReconciliationRun"}}},"description":"The run and its exceptions."},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Missing or invalid API key."},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"No such run."}},"summary":"Read one reconciliation run and every exception it raised","tags":["reconciliation"]}},"/v1/sagas":{"get":{"description":"The triage view. Defaults to `NEEDS_MANUAL_REVIEW`, which is the status\na human is paged about: automation has stopped, the funds are held in\nthe suspense account, and a person has to decide what happens next.\n","operationId":"listSagas","parameters":[{"description":"Defaults to `NEEDS_MANUAL_REVIEW`.","in":"query","name":"status","required":false,"schema":{"$ref":"#/components/schemas/SagaStatus"}},{"in":"query","name":"limit","required":false,"schema":{"default":100,"maximum":1000,"minimum":1,"type":"integer"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SagaList"}}},"description":"The matching sagas, newest first."},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"The limit is out of range."}},"summary":"List sagas by status","tags":["sagas"]}},"/v1/sagas/{id}":{"get":{"description":"Returns the saga and every attempt made against it, forward and\ncompensating, successful and failed. The history is the answer to \"what\nhappened to this payout\": a step that was refused four times and a step\nthat was never tried look identical from the status alone.\n","operationId":"getSaga","parameters":[{"in":"path","name":"id","required":true,"schema":{"format":"uuid","type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Saga"}}},"description":"The saga and its attempts."},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"No such saga."}},"summary":"Read a saga and its full attempt history","tags":["sagas"]}},"/v1/transactions":{"get":{"description":"The ledger explorer's search: one keyset-paginated page of transaction\nheaders, newest first, matching every filter supplied. Entries are not\nincluded -- a match is a candidate to open with `GET\n/v1/transactions/{id}`, not the full journal for every one at once.\n\n`external_ref` matches as a case-insensitive substring; every other\nfilter is an exact match. Requires authentication: a result carries\namounts and external references, the same class of information D24\nalready scopes idempotency responses to a principal to protect.\n","operationId":"searchTransactions","parameters":[{"in":"query","name":"external_ref","schema":{"type":"string"}},{"in":"query","name":"status","schema":{"$ref":"#/components/schemas/TransactionStatus"}},{"in":"query","name":"type","schema":{"$ref":"#/components/schemas/TransactionType"}},{"description":"Restrict to transactions with at least one entry against this account.","in":"query","name":"account_id","schema":{"format":"uuid","type":"string"}},{"description":"Start of the period. Defaults to 30 days ago.","in":"query","name":"from","schema":{"format":"date-time","type":"string"}},{"description":"End of the period. Defaults to now.","in":"query","name":"to","schema":{"format":"date-time","type":"string"}},{"description":"Page size. Clamped to 1000.","in":"query","name":"limit","schema":{"default":100,"maximum":1000,"minimum":1,"type":"integer"}},{"description":"The `next_cursor` from the previous page.","in":"query","name":"cursor","schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TransactionList"}}},"description":"One page of matching transactions."},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Missing or invalid API key."},"422":{"$ref":"#/components/responses/UnprocessableEntity"}},"summary":"Search transactions","tags":["transactions"]},"post":{"description":"Writes a transaction and its journal entries, and moves the affected\nbalances, in one database transaction.\n\nThe entries must sum to zero within a currency, and Phase 3 accepts a\nsingle currency per transaction. The idempotency record is written in\nthe same transaction as the journal entries, so the transaction and the\nrecord that describes it become durable together or not at all.\n","operationId":"postTransaction","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"content":{"application/json":{"examples":{"transfer":{"summary":"Move 1250 paise between two accounts","value":{"entries":[{"account_id":"018f3a1b-0000-7000-8000-000000000001","amount":{"amount":"1250","currency":"INR","scale":2},"direction":"DEBIT"},{"account_id":"018f3a1b-0000-7000-8000-000000000002","amount":{"amount":"1250","currency":"INR","scale":2},"direction":"CREDIT"}],"external_ref":"gw_8f2a41","metadata":{"channel":"upi"},"type":"TRANSFER"}}},"schema":{"$ref":"#/components/schemas/PostTransactionRequest"}}},"required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transaction"}}},"description":"Posted. A replayed response carries `Idempotent-Replay: true` and is\nbyte-for-byte the body stored when the transaction committed -- not\na re-rendering, so it does not drift across deploys.\n","headers":{"Idempotent-Replay":{"$ref":"#/components/headers/IdempotentReplay"}}},"400":{"$ref":"#/components/responses/BadRequest"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/UnprocessableEntity"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}},"summary":"Post a balanced transaction","tags":["transactions"]}},"/v1/transactions/{id}":{"get":{"description":"The ledger explorer's drill-down: the transaction header and every one\nof its entries, in submission order. Requires authentication, for the\nsame reason the search above does.\n","operationId":"getTransaction","parameters":[{"in":"path","name":"id","required":true,"schema":{"format":"uuid","type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transaction"}}},"description":"The transaction."},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Missing or invalid API key."},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"No such transaction."}},"summary":"Read one transaction and its journal entries","tags":["transactions"]}},"/v1/transactions/{id}/reverse":{"post":{"description":"Writes a new `REVERSAL` transaction whose legs mirror the original's,\nand marks the original `REVERSED`. The original's entries are never\ntouched: the journal rejects UPDATE and DELETE outright.\n\nA reversal can legitimately fail with `insufficient-funds`, because\nundoing a transfer moves money back out of the receiving account and\nthat account may have spent it. No amount of retrying will fix that.\n","operationId":"reverseTransaction","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"},{"description":"The transaction to reverse.","in":"path","name":"id","required":true,"schema":{"format":"uuid","type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReverseTransactionRequest"}}},"required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Transaction"}}},"description":"The reversal transaction.","headers":{"Idempotent-Replay":{"$ref":"#/components/headers/IdempotentReplay"}}},"400":{"$ref":"#/components/responses/BadRequest"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/UnprocessableEntity"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/Unavailable"}},"summary":"Reverse a posted transaction","tags":["transactions"]}}},"servers":[{"description":"Local development","url":"http://localhost:8080"}],"tags":[{"description":"The write path.","name":"transactions"},{"description":"Balances and statements.","name":"accounts"},{"description":"Multi-step, multi-party money movements. A saga spans an external payment\ngateway, so it cannot be one database transaction and is not one API call:\nstarting a payout returns immediately with a saga id, and the orchestrator\ndrives it to a terminal state on its own.\n","name":"sagas"},{"description":"Proving the ledger correct against a PSP settlement statement -- a\nthree-way match against the ledger's own transactions and the saga\norchestrator's records, keyed on external_ref. Read-only: runs are\nproduced on a schedule by cmd/reconciler, never triggered here.\n","name":"reconciliation"},{"description":"Liveness and readiness probes.","name":"health"}]}
