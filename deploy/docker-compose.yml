name: ledger-core

# Local orchestration for the whole stack. `docker compose up` from a clean
# machine brings up Postgres, applies migrations, starts Redpanda and Kafka
# Connect, registers the Debezium outbox connector, and starts the API.
#
# Every dependency edge uses a health condition rather than plain depends_on:
# without them, Connect races Postgres to a connection refused and Compose
# reports a healthy stack made of crash loops.

services:
  postgres:
    image: postgres:16-alpine
    # Pinned rather than left to Compose's own auto-naming (normally
    # <project>-<service>-<n>): cmd/chaos-harness pauses this container by
    # name over the Docker Engine API, and a name that changes with whatever
    # directory this repo happens to be checked out into would make its
    # default CHAOS_POSTGRES_CONTAINER wrong on every machine but the one it
    # was set on.
    container_name: ledger-postgres
    command:
      - postgres
      # wal_level=logical is what makes CDC possible at all. Debezium decodes
      # the write-ahead log; at the default 'replica' level the log does not
      # carry enough information to reconstruct row changes.
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Local only: makes slow queries visible while developing.
      - -c
      - log_min_duration_statement=200
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -U and -d are not optional here: bare pg_isready reports the server up
      # while it is still running its init scripts and refusing connections.
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # A real streaming (physical) hot standby, for Phase 7's read-replica
  # routing (docs/DECISIONS.md): GetBalanceAsOf and GetStatement read from
  # here, everything else -- including account_balances reads inside a
  # posting transaction -- stays on postgres. This is genuine
  # primary/standby WAL replication, not a second pool pointed at the same
  # database, specifically so replica lag is a real, measurable, honestly
  # documented thing rather than a number that could never be anything but
  # zero.
  postgres-replica:
    image: postgres:16-alpine
    container_name: ledger-postgres-replica
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ledger
      PGPASSWORD: ledger
    # If the data directory is already a base backup (every restart against
    # the existing volume), skip straight to starting postgres -- re-running
    # pg_basebackup against a non-empty PGDATA fails outright. Only the
    # FIRST start, against an empty volume, actually clones the primary.
    #
    # -R writes standby.signal and primary_conninfo for us, from a single
    # pg_basebackup flag, rather than hand-writing PostgreSQL 16's recovery
    # configuration. -S / -C create and use a dedicated, named replication
    # slot (ledger_replica_slot) -- the same mechanism the Debezium outbox
    # connector already uses on this same primary (migration 000008,
    # max_replication_slots=10 has room for both) -- so the primary retains
    # exactly the WAL this replica has not yet consumed, rather than
    # streaming without one and risking a standby that falls behind what
    # the primary has already recycled.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "postgres-replica: bootstrapping via pg_basebackup from postgres..."
          until pg_basebackup -h postgres -U ledger -D "$$PGDATA" -Fp -Xs -P -R -S ledger_replica_slot -C; do
            echo "postgres-replica: primary not ready for pg_basebackup yet, retrying..."
            sleep 2
          done
          chmod 0700 "$$PGDATA"
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      - up
    # A one-shot container. Services that need the schema wait on
    # service_completed_successfully rather than on this being "up".
    restart: on-failure

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    # Pinned for the identical reason postgres above is: cmd/chaos-harness
    # addresses this container by name.
    container_name: ledger-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two listeners: containers reach the broker as redpanda:29092, the host
      # as localhost:9092. A single listener cannot advertise an address that
      # resolves correctly from both sides.
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
      # Two arguments, not --set=k=v: rpk does not parse the joined form and
      # forwards it to the broker binary, which then refuses to start.
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: kafka-init
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      LEDGER_ENV: local
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: debug
    # A one-shot container, like migrate: everything that needs the topic
    # layout to exist -- with its explicit per-topic configuration, not
    # whatever the broker defaults to on first use -- waits on
    # service_completed_successfully rather than on this being "up".
    restart: on-failure

  connect:
    image: quay.io/debezium/connect:2.7
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Debezium's EventRouter SMT will happily produce to a topic that does
      # not exist yet -- Redpanda auto-creates it on first write, with broker
      # defaults, silently discarding kafka-init's explicit partition count
      # and retention the moment they would have mattered. Waiting here is
      # what makes kafka-init's provisioning the thing that actually decides
      # the topic layout, rather than a race it usually wins.
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: ledger-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Schemas off: the outbox payload is already a self-describing JSON
      # document, and wrapping it in a Connect envelope means every consumer
      # unwraps twice.
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  connect-init:
    image: curlimages/curl:8.10.1
    depends_on:
      connect:
        condition: service_healthy
      # The connector references public.outbox, so the table must exist before
      # it is registered.
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium/outbox-connector.json:/config/outbox-connector.json:ro
    # PUT against /config rather than POST to /connectors, so re-running
    # `docker compose up` updates the connector instead of failing with 409.
    command:
      - --fail
      - --show-error
      - --silent
      - -X
      - PUT
      - -H
      - "Content-Type: application/json"
      - --data
      - "@/config/outbox-connector.json"
      - http://connect:8083/connectors/ledger-outbox/config
    restart: on-failure

  redis:
    image: redis:7-alpine
    # Persistence off deliberately. Redis is the idempotency fast path only;
    # correctness lives in Postgres, and a durable Redis would invite code that
    # forgets that.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    environment:
      LEDGER_ENV: local
      LEDGER_HTTP_ADDR: ":8080"
      LEDGER_METRICS_ADDR: ":9090"
      LEDGER_POSTGRES_DSN: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      # Statement/balance-as-of reads only (internal/ledger/pgledger.WithReadReplica);
      # the write path and every other read stay on LEDGER_POSTGRES_DSN above.
      # Empty disables replica routing outright -- see config.Postgres.ReplicaDSN's
      # own doc comment.
      LEDGER_POSTGRES_REPLICA_DSN: postgres://ledger:ledger@postgres-replica:5432/ledger?sslmode=disable
      LEDGER_REDIS_ADDR: redis:6379
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: debug
      # Off by default, deliberately explicit rather than merely absent:
      # deploy/docker-compose.chaos.yml overrides this to "true" for a chaos
      # run, and stating the default here says what it is being overridden
      # FROM, not just that it happens to default to false somewhere in Go.
      LEDGER_FAULT_INJECTION_ENABLED: "false"
      # Shell-overridable for Phase 7's optimisation cycle (docs/DECISIONS.md):
      # `LEDGER_POSTGRES_MAX_CONNS=N docker compose up -d --force-recreate api`
      # sweeps the pool size without editing this file. The right-hand side of
      # each `:-` is internal/config's own default, restated here so this file
      # documents what a sweep is overriding FROM, per the same convention as
      # LEDGER_FAULT_INJECTION_ENABLED above.
      LEDGER_POSTGRES_MAX_CONNS: ${LEDGER_POSTGRES_MAX_CONNS:-20}
      LEDGER_POSTGRES_MIN_CONNS: ${LEDGER_POSTGRES_MIN_CONNS:-2}
      LEDGER_POSTGRES_QUERY_EXEC_MODE: ${LEDGER_POSTGRES_QUERY_EXEC_MODE:-cache_statement}
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  outbox-publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: outbox-publisher
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      # Registered here even though the debezium arm (the default) does not
      # touch Kafka Connect's data plane itself -- it only polls
      # /connectors/ledger-outbox/status, and there is no point starting that
      # poll loop before connect-init has had a chance to register what it is
      # polling for.
      connect-init:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: local
      LEDGER_METRICS_ADDR: ":9091"
      LEDGER_POSTGRES_DSN: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: debug
      # debezium is the default in config.go too; stated explicitly here so
      # switching arms for a local comparison is one line to change, per
      # docs/DECISIONS.md D31.
      LEDGER_OUTBOX_PUBLISHER: debezium
      LEDGER_OUTBOX_CONNECT_URL: http://connect:8083
      LEDGER_OUTBOX_CONNECTOR_NAME: ledger-outbox
    ports:
      - "9091:9091"
    healthcheck:
      # cmd/outbox-publisher, like cmd/reconciler, is a background worker with
      # no user-facing API -- it serves health and metrics together on the
      # metrics listener rather than opening a second HTTP_ADDR nothing would
      # ever bind, so this is the same port the LEDGER_METRICS_ADDR above
      # names, not a separate app port.
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  projector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: projector
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      # The projector's whole job is to consume what the publisher produces;
      # starting it before there is anything registered to publish just means
      # its first several polls return nothing.
      connect-init:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: local
      # 9093, not 9092 -- 9092 is redpanda's own host-mapped Kafka port.
      LEDGER_METRICS_ADDR: ":9093"
      LEDGER_POSTGRES_DSN: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: debug
    ports:
      - "9093:9093"
    healthcheck:
      # Same reasoning as outbox-publisher above: cmd/projector serves health
      # and metrics together on the metrics listener; there is no separate
      # HTTP_ADDR port to point this at.
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # A stand-in for the external payment gateway. Local development only, and
  # the process says so in its own startup log.
  #
  # It holds payments in memory on purpose: restarting it loses them, which is
  # the only faithful way to reproduce the worst case the saga has to survive --
  # a gateway that cannot tell you what it did. `docker compose pause
  # mock-gateway` mid-payout drives the same path.
  mock-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: mock-gateway
    environment:
      LEDGER_ENV: local
      LEDGER_HTTP_ADDR: ":8090"
      LEDGER_LOG_LEVEL: debug
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  saga-orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: saga-orchestrator
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # The orchestrator calls the gateway on its third step. Starting before
      # the gateway answers would turn every early saga into an ambiguity to
      # be probed away -- correct, but a noisy and pointless way to start up.
      mock-gateway:
        condition: service_healthy
    environment:
      LEDGER_ENV: local
      # 9094: 9090-9093 are taken by api, outbox-publisher, redpanda's host
      # Kafka port, and the projector respectively.
      LEDGER_METRICS_ADDR: ":9094"
      LEDGER_POSTGRES_DSN: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      LEDGER_GATEWAY_URL: http://mock-gateway:8090
      LEDGER_LOG_LEVEL: debug
      # See the identical flag on the api service above -- same default,
      # same override file, same reasoning.
      LEDGER_FAULT_INJECTION_ENABLED: "false"
    ports:
      - "9094:9094"
    healthcheck:
      # Health and metrics share the metrics listener, as in every worker here;
      # there is no separate HTTP_ADDR port to point this at. See D35.
      test: ["CMD", "wget", "-qO-", "http://localhost:9094/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  reconciler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: reconciler
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: local
      # 9095: 9090-9094 are taken by api, outbox-publisher, redpanda's host
      # Kafka port, the projector and the saga orchestrator respectively.
      LEDGER_METRICS_ADDR: ":9095"
      LEDGER_POSTGRES_DSN: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      LEDGER_LOG_LEVEL: debug
      # Empty by default: this container has no PSP statement to reconcile
      # against out of the box, and a reconciler that failed every tick on a
      # missing file would be a worse default than one that says so once and
      # idles. See README.md's Reconciliation section for how to point this
      # at deploy/seed/psp_statement.example.csv once you have posted matching
      # transactions to try it against.
      LEDGER_RECONCILER_PSP_CSV_PATH: ""
    ports:
      - "9095:9095"
    healthcheck:
      # Health and metrics share the metrics listener, as in every worker
      # here; there is no separate HTTP_ADDR port to point this at. See D35.
      test: ["CMD", "wget", "-qO-", "http://localhost:9095/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9099:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local only, and deliberately obvious for the same reason
      # api_keys' seeded dev key is (see deploy/seed/seed.sql): unmistakable
      # in a diff or a log line, and it authenticates nothing this stack does
      # not already expose on localhost with no auth at all.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    # A single mount, deliberately: the dashboard JSON lives inside
    # grafana/provisioning/dashboards/files rather than in a sibling
    # directory mounted separately, because mounting a second bind volume
    # AT A PATH INSIDE this one -- the original shape here -- fails outright.
    # Docker has to create that path's mountpoint inside the already-mounted
    # read-only provisioning tree, and cannot: "read-only file system".
    # Discovered by actually running `docker compose up`, not by reading the
    # compose file, exactly the class of defect D35 says this stack's own
    # Definition of Done exists to catch.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host port 3001, not Grafana's usual 3000: 3000 is a common default for
      # unrelated local dev tooling, and this stack should not assume it owns
      # a port nothing here requested. The container's own internal port
      # stays 3000, so nothing inside this compose network needs to know the
      # remap happened.
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
  postgres-replica-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
