apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-core-api
  labels:
    app.kubernetes.io/name: ledger-core
    app.kubernetes.io/instance: ledger-core
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-core-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up promptly -- a payments API under real load should not wait
    # to add capacity -- but scale down cautiously: a five-minute
    # stabilization window is what keeps a brief dip from flapping
    # replicas back down and then immediately back up again.
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0

