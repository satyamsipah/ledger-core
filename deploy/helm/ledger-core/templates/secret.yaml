# Templated from Values so `helm install -f secrets.values.yaml` (a file
# kept out of version control) or `--set postgres.dsn=...` from a CI
# secret store both work -- this template itself contains no secret
# material, only the keys. `required` on each makes a missing value a
# failed `helm install`/`upgrade`, never a Secret silently created with an
# empty string a Deployment would then start against.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger-core.fullname" . }}-secret
  labels:
    {{- include "ledger-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  LEDGER_POSTGRES_DSN: {{ .Values.postgres.dsn | required "postgres.dsn is required -- a managed Postgres connection string, never committed" | quote }}
  # A gateway URL can carry embedded credentials in its query string
  # depending on the provider, so this lives in the Secret rather than the
  # ConfigMap even though a bare hostname would not need to.
  LEDGER_GATEWAY_URL: {{ .Values.gateway.url | required "gateway.url is required -- the real payment gateway, never a mock" | quote }}
