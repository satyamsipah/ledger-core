name: ledger-core-prod

# Single-VPS production deployment: one machine, `docker compose pull &&
# docker compose -f deploy/docker-compose.prod.yml up -d`, no orchestrator.
# This is deliberately not deploy/docker-compose.yml with a few flags
# changed -- it makes different choices for a different environment, each
# stated below rather than left implicit:
#
#   - Images are PULLED (${REGISTRY}/<service>:${TAG}), never built. Building
#     on the box you're serving traffic from means a slow or failed build
#     degrades production; CI builds and pushes (see
#     .github/workflows/deploy.yml), this file only ever runs what already
#     passed CI.
#   - The polling outbox publisher (LEDGER_OUTBOX_PUBLISHER=polling), not
#     Debezium. Local dev's Debezium arm needs a whole Kafka Connect JVM
#     process plus its own connector registration step; the polling arm is
#     one more of this repo's own Go binaries and nothing else, which is the
#     right trade on a single VPS's resource budget. See docs/DECISIONS.md
#     D31 for the full comparison and what each arm actually costs.
#   - No Redis. D23: "Redis is specified and not implemented" -- nothing in
#     this codebase reads from it yet, and running an unused dependency in
#     production is a security and operational surface for zero benefit.
#     Add it here the day `ledger_idempotency_outcomes_total{outcome=
#     "cache_hit"}` actually makes the case, not before.
#   - No mock-gateway. It is explicitly LOCAL ONLY (its own compose comment
#     says so); LEDGER_GATEWAY_URL below must point at a real payment
#     gateway, supplied by the operator, with no default.
#   - Every credential is a required environment variable with NO fallback
#     baked into this file -- deploy/env.prod.example documents each one.
#     `docker compose ... up` fails loudly on a missing one rather than
#     silently running with deploy/docker-compose.yml's well-known local
#     password.
#
# What this file does NOT give you that Kubernetes (deploy/helm/) does:
# horizontal autoscaling, a PodDisruptionBudget, or surviving the loss of
# the one VPS it runs on. It is the smaller, cheaper option for a workload
# that fits on one machine -- not a scaled-down Kubernetes.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- see deploy/env.prod.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    mem_limit: 2g
    cpus: 2.0

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://${LEDGER_PUBLIC_HOST:-localhost}:9092
      - --set
      - redpanda.auto_create_topics_enabled=false
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 1g
    cpus: 1.0

  # cmd/migrate, not deploy/docker-compose.yml's migrate/migrate:v4.17.1 +
  # bind-mounted ../migrations. This image carries its own migrations,
  # embedded at build time (migrations/embed.go) -- the same mechanism
  # deploy/helm/ledger-core's migration Job hook uses, so a single-VPS and
  # a Kubernetes deploy migrate identically, and this file needs nothing
  # from the repo checked out on the VPS beyond itself and env.prod.example.
  migrate:
    image: ${REGISTRY:-ghcr.io/satyamsipah/ledger-core}-migrate:${TAG:?TAG is required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEDGER_ENV: production
      LEDGER_POSTGRES_DSN: postgres://ledger:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ledger?sslmode=disable
      LEDGER_LOG_LEVEL: info
    restart: on-failure

  kafka-init:
    image: ${REGISTRY:-ghcr.io/satyamsipah/ledger-core}-kafka-init:${TAG:?TAG is required -- e.g. the release tag this compose file was pulled for}
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      LEDGER_ENV: production
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: info
    restart: on-failure

  api:
    image: ${REGISTRY:-ghcr.io/satyamsipah/ledger-core}-api:${TAG:?TAG is required}
    restart: unless-stopped
    depends_on:
      # Not kafka-init: cmd/api writes outbox rows to Postgres inside the
      # same transaction as the journal (invariant 6) and never touches
      # Kafka directly -- see deploy/docker-compose.yml's identical
      # dependency list for the api service, which omits it for the same
      # reason.
      migrate:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: production
      LEDGER_HTTP_ADDR: ":8080"
      LEDGER_METRICS_ADDR: ":9090"
      LEDGER_POSTGRES_DSN: postgres://ledger:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ledger?sslmode=disable
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: info
      LEDGER_FAULT_INJECTION_ENABLED: "false"
      LEDGER_POSTGRES_MAX_CONNS: ${LEDGER_POSTGRES_MAX_CONNS:-20}
      LEDGER_POSTGRES_MIN_CONNS: ${LEDGER_POSTGRES_MIN_CONNS:-2}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  outbox-publisher:
    image: ${REGISTRY:-ghcr.io/satyamsipah/ledger-core}-outbox-publisher:${TAG:?TAG is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: production
      LEDGER_METRICS_ADDR: ":9091"
      LEDGER_POSTGRES_DSN: postgres://ledger:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ledger?sslmode=disable
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: info
      LEDGER_OUTBOX_PUBLISHER: polling
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  projector:
    image: ${REGISTRY:-ghcr.io/satyamsipah/ledger-core}-projector:${TAG:?TAG is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: production
      LEDGER_METRICS_ADDR: ":9093"
      LEDGER_POSTGRES_DSN: postgres://ledger:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ledger?sslmode=disable
      LEDGER_KAFKA_BROKERS: redpanda:29092
      LEDGER_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  saga-orchestrator:
    image: ${REGISTRY:-ghcr.io/satyamsipah/ledger-core}-saga-orchestrator:${TAG:?TAG is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: production
      LEDGER_METRICS_ADDR: ":9094"
      LEDGER_POSTGRES_DSN: postgres://ledger:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ledger?sslmode=disable
      # No default: deploy/docker-compose.yml's mock-gateway is LOCAL ONLY.
      # A real payment gateway's URL belongs in deploy/env.prod.example's
      # copy on the VPS, never in this file.
      LEDGER_GATEWAY_URL: ${LEDGER_GATEWAY_URL:?LEDGER_GATEWAY_URL is required -- the real payment gateway, never mock-gateway}
      LEDGER_LOG_LEVEL: info
      LEDGER_FAULT_INJECTION_ENABLED: "false"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  reconciler:
    image: ${REGISTRY:-ghcr.io/satyamsipah/ledger-core}-reconciler:${TAG:?TAG is required}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      LEDGER_ENV: production
      LEDGER_METRICS_ADDR: ":9095"
      LEDGER_POSTGRES_DSN: postgres://ledger:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ledger?sslmode=disable
      LEDGER_LOG_LEVEL: info
      # Empty by default, exactly as deploy/docker-compose.yml documents:
      # a meaningful reconciliation demo needs a real PSP statement feed,
      # which is an operator integration, not something this file can
      # default sensibly. See README.md's Reconciliation section.
      LEDGER_RECONCILER_PSP_CSV_PATH: ${LEDGER_RECONCILER_PSP_CSV_PATH:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Local dev never sets a retention flag and takes Prometheus's own
      # 15-day default; production states it, because "how long do we keep
      # this" should be a decision on record, not whatever upstream shipped.
      - --storage.tsdb.retention.time=30d
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 5s
    mem_limit: 1g
    cpus: 0.5

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required -- deploy/docker-compose.yml's admin/admin is a local-only default, never a production one}
      # Anonymous viewer access is deploy/docker-compose.yml's local-only
      # convenience. Off here by default; there is no equivalent excuse for
      # letting anyone who can reach this port read production dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5

volumes:
  postgres-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
