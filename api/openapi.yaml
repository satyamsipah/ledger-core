openapi: 3.1.0

info:
  title: Ledger-Core API
  version: 0.4.0
  description: |
    The write and read surface of a double-entry ledger.

    Three things about this API are unusual enough to state up front, because
    each is a deliberate constraint rather than an oversight.

    **Money is a string.** Every amount is a decimal string of *minor units*
    (paise, cents) plus an ISO-4217 code and its exponent. It is a string
    because JSON numbers become IEEE-754 doubles in JavaScript, which silently
    loses precision past 2^53 minor units -- so a ledger sending numbers
    corrupts exactly its largest and most important rows. The API rejects a
    JSON number for an amount rather than accepting one that happens to round
    trip today.

    **Writes require an Idempotency-Key.** Required, not optional: an optional
    key is one a client forgets under precisely the conditions -- timeouts,
    retries, a partial outage -- that make it matter. Retrying a request with
    the same key never creates a second transaction, at any level of
    concurrency, and a retry after the original completed replays the stored
    response byte for byte with `Idempotent-Replay: true`.

    **Nothing is ever edited.** The journal is append-only. A mistake is
    corrected by posting a reversal, which is a new transaction with mirrored
    legs, so the ledger can always answer what it believed at any past instant.

  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: transactions
    description: The write path.
  - name: accounts
    description: Balances and statements.
  - name: sagas
    description: |
      Multi-step, multi-party money movements. A saga spans an external payment
      gateway, so it cannot be one database transaction and is not one API call:
      starting a payout returns immediately with a saga id, and the orchestrator
      drives it to a terminal state on its own.
  - name: reconciliation
    description: |
      Proving the ledger correct against a PSP settlement statement -- a
      three-way match against the ledger's own transactions and the saga
      orchestrator's records, keyed on external_ref. Read-only: runs are
      produced on a schedule by cmd/reconciler, never triggered here.
  - name: health
    description: Liveness and readiness probes.

paths:
  /v1/transactions:
    post:
      tags: [transactions]
      summary: Post a balanced transaction
      operationId: postTransaction
      description: |
        Writes a transaction and its journal entries, and moves the affected
        balances, in one database transaction.

        The entries must sum to zero within a currency, and Phase 3 accepts a
        single currency per transaction. The idempotency record is written in
        the same transaction as the journal entries, so the transaction and the
        record that describes it become durable together or not at all.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTransactionRequest'
            examples:
              transfer:
                summary: Move 1250 paise between two accounts
                value:
                  type: TRANSFER
                  external_ref: gw_8f2a41
                  metadata:
                    channel: upi
                  entries:
                    - account_id: 018f3a1b-0000-7000-8000-000000000001
                      direction: DEBIT
                      amount: { amount: "1250", currency: INR, scale: 2 }
                    - account_id: 018f3a1b-0000-7000-8000-000000000002
                      direction: CREDIT
                      amount: { amount: "1250", currency: INR, scale: 2 }
      responses:
        '201':
          description: |
            Posted. A replayed response carries `Idempotent-Replay: true` and is
            byte-for-byte the body stored when the transaction committed -- not
            a re-rendering, so it does not drift across deploys.
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/transactions/{id}/reverse:
    post:
      tags: [transactions]
      summary: Reverse a posted transaction
      operationId: reverseTransaction
      description: |
        Writes a new `REVERSAL` transaction whose legs mirror the original's,
        and marks the original `REVERSED`. The original's entries are never
        touched: the journal rejects UPDATE and DELETE outright.

        A reversal can legitimately fail with `insufficient-funds`, because
        undoing a transfer moves money back out of the receiving account and
        that account may have spent it. No amount of retrying will fix that.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          description: The transaction to reverse.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseTransactionRequest'
      responses:
        '201':
          description: The reversal transaction.
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/accounts/{id}/balance:
    get:
      tags: [accounts]
      summary: Read an account's balance
      operationId: getAccountBalance
      description: |
        Without `as_of`, returns the synchronous balance maintained inside the
        posting transaction under the account's row lock. This is the
        authoritative figure -- the one the overdraft constraint is evaluated
        against -- not the Kafka-driven projection.

        With `as_of`, recomputes the balance from the journal at an instant.
        That answer is **bounded-stale by design**: journal entries are stamped
        with transaction *start* time, so a query for 12:00:01 run at 12:00:02
        misses a transaction that began at 12:00:00 and has not yet committed.
        The answer becomes stable once no transaction older than the requested
        instant is still in flight.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: as_of
          in: query
          required: false
          description: RFC 3339 instant to reconstruct the balance at.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The balance.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Balance'
                  - $ref: '#/components/schemas/BalanceAsOf'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{id}/statement:
    get:
      tags: [accounts]
      summary: Read one page of an account's history
      operationId: getAccountStatement
      description: |
        Keyset-paginated, not offset-paginated. The journal is append-only and
        constantly growing, so `OFFSET 50000` makes the database walk fifty
        thousand rows it then discards, and any entry inserted between two page
        requests shifts every later offset by one -- so a client paging a busy
        account both pays more per page and silently skips rows.

        Follow `next_cursor` to the next page. The cursor is opaque: it encodes
        a `(created_at, id)` pair, because timestamps tie and paginating on the
        timestamp alone would repeat or drop entries at a page boundary. Do not
        construct one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Start of the period. Defaults to 30 days ago.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the period. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Page size. Clamped to 1000.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: The `next_cursor` from the previous page.
          schema:
            type: string
      responses:
        '200':
          description: One page, with a running balance continuous across pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealthz
      description: |
        Checks nothing on purpose. Liveness asks "is this process wedged?", and
        answering it with a database ping means one slow query restarts every
        replica at once. Dependency health belongs in readiness.
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadyz
      description: Reports whether this instance can serve traffic, naming any dependency that failed.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready. The `checks` map names what failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /v1/payouts:
    post:
      tags: [sagas]
      summary: Start a marketplace payout saga
      operationId: startPayout
      description: |
        Begins a payout: the customer's wallet is debited into platform
        suspense, an external gateway is called, and on success the merchant
        payable and fee revenue accounts are credited. On failure the reserve
        is compensated with a reversing transaction.

        Returns **202, not 201**. No money has moved when this returns; the
        saga is queued and an orchestrator claims it. Poll `GET /v1/sagas/{id}`
        for the outcome, or consume `SagaStepCompleted` from
        `ledger.events.saga`.

        `Idempotency-Key` is required, as on every write. It dedupes the whole
        saga rather than a single transaction: retrying with the same key
        returns the saga that was already started.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPayoutRequest'
      responses:
        '202':
          description: The saga was accepted, or already existed under this key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saga'
        '400':
          description: Missing or malformed idempotency key, or malformed body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The payout is not representable -- unknown account, mixed currency, fee at or above the amount.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/sagas:
    get:
      tags: [sagas]
      summary: List sagas by status
      operationId: listSagas
      description: |
        The triage view. Defaults to `NEEDS_MANUAL_REVIEW`, which is the status
        a human is paged about: automation has stopped, the funds are held in
        the suspense account, and a person has to decide what happens next.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SagaStatus'
          description: Defaults to `NEEDS_MANUAL_REVIEW`.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: The matching sagas, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SagaList'
        '422':
          description: The limit is out of range.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/sagas/{id}:
    get:
      tags: [sagas]
      summary: Read a saga and its full attempt history
      operationId: getSaga
      description: |
        Returns the saga and every attempt made against it, forward and
        compensating, successful and failed. The history is the answer to "what
        happened to this payout": a step that was refused four times and a step
        that was never tried look identical from the status alone.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The saga and its attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saga'
        '404':
          description: No such saga.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/reconciliation/runs:
    get:
      tags: [reconciliation]
      summary: List recent reconciliation runs
      operationId: listReconciliationRuns
      description: |
        Newest first. cmd/reconciler produces these on a schedule (daily by
        default); this endpoint only reads what it already found. Requires
        authentication, unlike the saga read routes -- a run's exceptions
        carry amounts and external references, the class of information D24
        already scopes idempotency responses to a principal to protect.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: The most recent runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRunList'
        '401':
          description: Missing or invalid API key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The limit is out of range.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/reconciliation/runs/{id}:
    get:
      tags: [reconciliation]
      summary: Read one reconciliation run and every exception it raised
      operationId: getReconciliationRun
      description: |
        The daily report: the run's own counts, a breakdown by category, and
        the full list of exceptions -- MISSING_IN_LEDGER, MISSING_IN_PSP,
        AMOUNT_MISMATCH, STATUS_MISMATCH, an unresolved TIMING_DIFFERENCE, or
        DUPLICATE. A TIMING_DIFFERENCE inside the configured window does not
        appear here as OPEN; it is included with `status: AUTO_RESOLVED`, so
        the run's exception list always reconciles to `exception_count`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The run and its exceptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
        '401':
          description: Missing or invalid API key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such run.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: lk_live_<64 hex characters>
      description: |
        A key minted by `cmd/issue-api-key`. Presented as
        `Authorization: Bearer <key>`. Required on every write route; read
        routes take none, because there is no per-principal authorization
        model on this schema yet (see docs/DECISIONS.md D47) -- authentication
        alone is what scopes the idempotency namespace, which is all this
        header exists to provide today.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A UUID naming this logical operation.

        A UUID rather than any opaque string, because keys share a namespace
        WITHIN one authenticated principal: a client picking `order-1` would
        collide with its own earlier `order-1`, and the second would be handed
        the first's response. Two different principals may use the identical
        key without either affecting the other -- the namespace is
        (principal, key), never key alone.

        Retry semantics, in the order they are decided:

        | Condition | Result |
        |---|---|
        | Same key, same body, original completed | `201` replay with `Idempotent-Replay: true` |
        | Same key, same body, original still running | `409` with `Retry-After` |
        | Same key, **different** body | `422` |
        | Same key, replay record expired (24h) | `409` -- refused, never re-executed |

        The fingerprint covers the canonical request body (RFC 8785) plus the
        method and route, so a key reused across two endpoints is a `422` rather
        than a wrong answer. Two bodies that differ only in whitespace, key
        order or number formatting are the same request.
      schema:
        type: string
        format: uuid

  headers:
    IdempotentReplay:
      description: Present and `true` when this response was replayed from a stored record rather than freshly executed.
      schema:
        type: string
        const: "true"

  schemas:
    Money:
      type: object
      description: |
        An exact amount in the minor units of one currency. `amount` is a
        STRING of minor units, never a JSON number -- see the API description
        for why. `scale` is the ISO-4217 exponent and affects presentation only;
        it never enters arithmetic.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+$'
          description: Minor units as a decimal string. 1250 with scale 2 is 12.50.
          examples: ["1250"]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [INR]
        scale:
          type: integer
          minimum: 0
          maximum: 4
          description: Where the decimal point goes. Rejected if it disagrees with the currency.
          examples: [2]

    Direction:
      type: string
      enum: [DEBIT, CREDIT]
      description: Which side of the journal an entry falls on. Sign lives here, never in the amount.

    TransactionType:
      type: string
      enum: [TRANSFER, PAYIN, PAYOUT, FEE, FX, REVERSAL, ADJUSTMENT]
      description: |
        `FX` is accepted by the schema but not reachable through this API yet:
        posting spans a single currency until exchange-rate handling exists.
        `REVERSAL` is produced by the reverse endpoint, not submitted.

    TransactionStatus:
      type: string
      enum: [PENDING, POSTED, REVERSED]

    EntryRequest:
      type: object
      required: [account_id, direction, amount]
      properties:
        account_id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        amount: { $ref: '#/components/schemas/Money' }
      additionalProperties: false

    PostTransactionRequest:
      type: object
      required: [type, entries]
      description: |
        Unknown fields are rejected. A client sending `ammount` has made a typo
        that would otherwise post a zero-amount transaction, and in a ledger the
        silent interpretation of a misspelled field is a defect.
      properties:
        type: { $ref: '#/components/schemas/TransactionType' }
        external_ref:
          type: string
          description: The caller's own reference, for support lookups.
        metadata:
          type: object
          description: Arbitrary JSON, carried and never interpreted.
          additionalProperties: true
        entries:
          type: array
          minItems: 2
          description: Must sum to zero within a currency; all entries share one currency.
          items: { $ref: '#/components/schemas/EntryRequest' }
      additionalProperties: false

    ReverseTransactionRequest:
      type: object
      required: [reason]
      description: |
        The reason is required, not documentation. A reversal is the only way
        history is ever corrected, so an unexplained one is an audit hole.
      properties:
        reason:
          type: string
          minLength: 1
          examples: ["chargeback: gateway reference gw_8f2a41"]
      additionalProperties: false

    Entry:
      type: object
      required: [id, account_id, direction, amount, entry_seq, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        amount: { $ref: '#/components/schemas/Money' }
        entry_seq:
          type: integer
          description: Position within the transaction, numbered from zero in submission order.
        created_at: { type: string, format: date-time }

    Transaction:
      type: object
      required: [id, type, status, created_at, entries]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TransactionType' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        idempotency_key: { type: string, format: uuid }
        external_ref: { type: string }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        posted_at:
          type: string
          format: date-time
          description: Set exactly when the transaction leaves PENDING.
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }

    Balance:
      type: object
      required: [account_id, available, version, updated_at]
      properties:
        account_id: { type: string, format: uuid }
        available: { $ref: '#/components/schemas/Money' }
        pending: { $ref: '#/components/schemas/Money' }
        version:
          type: integer
          format: int64
          description: |
            Monotonic per account, bumped on every balance change. Consumers of
            the event stream use it to discard a redelivered event, since outbox
            delivery is at-least-once.
        updated_at: { type: string, format: date-time }

    BalanceAsOf:
      type: object
      required: [account_id, as_of, balance]
      properties:
        account_id: { type: string, format: uuid }
        as_of:
          type: string
          format: date-time
          description: Echoed back, because the answer is bounded-stale and it must be clear which question was answered.
        balance: { $ref: '#/components/schemas/Money' }

    StatementLine:
      type: object
      required: [entry, signed, running_balance]
      properties:
        entry: { $ref: '#/components/schemas/Entry' }
        signed:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            The entry amount in this account's own direction: positive when it
            increases what the account holds, whatever the account's type. This
            is the only place in the API where a negative amount is legal.
        running_balance:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: The balance immediately after this entry, counted from `opening`.

    Statement:
      type: object
      required: [account_id, currency, from, to, opening, closing, lines, next_cursor]
      properties:
        account_id: { type: string, format: uuid }
        currency: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        opening:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            The balance immediately before this page's first line -- not before
            the requested period. On page three it is page two's closing
            balance, so running totals stay continuous across pages.
        closing: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/StatementLine' }
        next_cursor:
          type: [string, 'null']
          description: Null on the last page. Opaque; pass it back as `cursor`.

    Readiness:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not ready]
        checks:
          type: object
          description: Dependency name to `ok` or the failure message.
          additionalProperties: { type: string }

    SagaStatus:
      type: string
      description: |
        A saga's position in its state machine. Every value is a SETTLED state:
        there is no "in progress" status, because a step commits its ledger
        entries and its transition together, so no crash can leave a saga
        describing itself as halfway through something.

        `GATEWAY_PENDING` is the one that matters operationally. It means the
        gateway's outcome is UNKNOWN -- still in flight, timed out, or the
        orchestrator died mid-call, which are indistinguishable from here. The
        saga resolves it by asking the gateway, never by assuming.

        `NEEDS_MANUAL_REVIEW` is terminal for automation only. The funds are
        held in the suspense account and a person has to act.
      enum:
        - PENDING
        - RESERVED
        - GATEWAY_PENDING
        - GATEWAY_SUCCEEDED
        - GATEWAY_FAILED
        - COMPENSATING
        - COMPLETED
        - COMPENSATED
        - FAILED
        - NEEDS_MANUAL_REVIEW

    StartPayoutRequest:
      type: object
      required: [customer_wallet_id, platform_suspense_id, merchant_payable_id, fee_revenue_id, amount]
      properties:
        customer_wallet_id: { type: string, format: uuid }
        platform_suspense_id:
          type: string
          format: uuid
          description: |
            Where the funds wait while the gateway is called. This account is
            what makes an unknown gateway outcome survivable: the money is out
            of the customer's wallet and not yet the merchant's, so it is owned
            by nobody and lost by nobody for as long as the ambiguity lasts.
        merchant_payable_id: { type: string, format: uuid }
        fee_revenue_id: { type: string, format: uuid }
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            Optional, and must share the payout's currency and be strictly less
            than it. Omitted or zero means no fee leg is posted at all -- a
            zero-amount journal entry is rejected by the schema.
        external_ref: { type: string }

    Saga:
      type: object
      required: [id, saga_type, status, current_step, retry_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        saga_type: { type: string }
        status:
          $ref: '#/components/schemas/SagaStatus'
        current_step:
          type: string
          enum: [RESERVE, GATEWAY, SETTLE, DONE]
        retry_count: { type: integer }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        attempts:
          type: array
          description: Present on the single-saga read. Every attempt, in order.
          items:
            $ref: '#/components/schemas/SagaAttempt'

    SagaAttempt:
      type: object
      required: [step, direction, attempt, status, started_at]
      properties:
        step: { type: string, enum: [RESERVE, GATEWAY, SETTLE] }
        direction: { type: string, enum: [FORWARD, COMPENSATION] }
        attempt: { type: integer }
        status:
          type: string
          enum: [ATTEMPTED, SUCCEEDED, FAILED]
          description: |
            `ATTEMPTED` with no `finished_at` is the write-ahead intent record,
            committed before the work began. On the gateway step it is the
            durable evidence that a payment may exist under a known key.
        transaction_id:
          type: string
          format: uuid
          description: The ledger transaction this step posted. Absent for the gateway step, which posts none.
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    SagaList:
      type: object
      required: [status, sagas]
      properties:
        status: { type: string }
        sagas:
          type: array
          items:
            $ref: '#/components/schemas/Saga'

    ReconciliationRun:
      type: object
      required: [id, source, started_at, status, psp_row_count, matched_count, auto_resolved_count, exception_count]
      properties:
        id: { type: string, format: uuid }
        source:
          type: string
          description: Where the PSP statement came from -- a file path in this deployment.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        psp_row_count: { type: integer }
        matched_count:
          type: integer
          description: References where the ledger, the saga (if any) and the PSP statement agreed outright.
        auto_resolved_count:
          type: integer
          description: TIMING_DIFFERENCE findings closed automatically because the gap was inside the configured window.
        exception_count: { type: integer }
        error:
          type: string
          description: Populated only when status is FAILED.
        by_category:
          type: object
          description: |
            Exception counts keyed by category, e.g. {"AMOUNT_MISMATCH": 2}.
            Absent categories found none.
          additionalProperties: { type: integer }
        exceptions:
          type: array
          description: Present on the single-run read.
          items:
            $ref: '#/components/schemas/ReconciliationException'

    ReconciliationException:
      type: object
      required: [id, external_ref, category, status, created_at]
      properties:
        id: { type: string, format: uuid }
        external_ref: { type: string }
        category:
          type: string
          enum: [MISSING_IN_LEDGER, MISSING_IN_PSP, AMOUNT_MISMATCH, STATUS_MISMATCH, TIMING_DIFFERENCE, DUPLICATE]
        status:
          type: string
          enum: [OPEN, AUTO_RESOLVED, RESOLVED]
        ledger_transaction_id: { type: string, format: uuid }
        saga_id: { type: string, format: uuid }
        ledger_amount_minor: { type: integer, description: Sum of the matched transaction's DEBIT-side entries. }
        psp_amount_minor: { type: integer }
        currency: { type: string }
        ledger_status: { type: string }
        psp_status: { type: string }
        details:
          type: object
          description: Category-specific detail -- e.g. the PSP row count for a DUPLICATE, the computed gap for a TIMING_DIFFERENCE.
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    ReconciliationRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationRun'

    ProblemType:
      type: string
      description: |
        The complete set of machine-readable failure identifiers, without the
        `https://ledger-core.invalid/problems/` prefix. This list is the
        contract: switch on it rather than on `title` or `detail`, which are
        prose and may be reworded without notice.

        `TestOpenAPI_DocumentsEveryProblemType` fails the build if the service
        can emit an identifier that does not appear here, so the list cannot
        silently fall behind the code.
      enum:
        - account-not-found
        - account-not-postable
        - already-reversed
        - amount-overflow
        - canceled
        - currency-mismatch
        - idempotency-key-expired
        - idempotency-key-reused
        - invalid-api-key
        - missing-api-key
        - insufficient-funds
        - internal
        - invalid-currency
        - invalid-entry
        - invalid-idempotency-key
        - invalid-transaction-type
        - malformed-body
        - missing-idempotency-key
        - mixed-currency
        - reconciliation-run-not-found
        - request-in-progress
        - reversal-reason-required
        - saga-conflict
        - saga-not-found
        - scale-mismatch
        - timeout
        - too-few-entries
        - transaction-not-found
        - transaction-not-posted
        - unbalanced-transaction

    Problem:
      type: object
      description: RFC 9457 problem detail. Every error response uses this shape.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable, machine-readable identifier for the failure. Switch on this
            rather than on `title` or `detail`, both of which are prose and may
            be reworded. It names the problem and is not expected to resolve.
          examples: ["https://ledger-core.invalid/problems/insufficient-funds"]
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: The specific cause, naming the account or entry at fault. Omitted on 5xx.
        instance: { type: string }
        request_id:
          type: string
          description: Correlates this response with the server's logs and traces.

  responses:
    BadRequest:
      description: |
        The request could not be processed as sent: a missing or non-UUID
        `Idempotency-Key`, a body that is not JSON, or a reversal with no reason.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotFound:
      description: No such account or transaction.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Conflict:
      description: |
        A live idempotency lease holds this key (`Retry-After` says when it
        frees), or the key already created a transaction whose stored response
        has expired, or the transaction is already reversed.
      headers:
        Retry-After:
          description: Seconds to wait. Derived from the remaining lease, never a fixed guess.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    UnprocessableEntity:
      description: |
        The request was understood and refused: the transaction does not
        balance, an account has insufficient funds, or this idempotency key was
        already used with a different body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    InternalError:
      description: |
        Something failed on our side. `detail` is omitted deliberately -- a
        constraint or table name in a public error body is free reconnaissance.
        Quote `request_id` when reporting it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Unavailable:
      description: |
        The request exceeded its deadline and was abandoned, so its outcome is
        unknown. Retry with the SAME idempotency key: if the transaction did in
        fact commit, the retry replays it rather than posting a second one.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
