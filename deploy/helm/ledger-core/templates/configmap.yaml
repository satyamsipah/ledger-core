apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ledger-core.fullname" . }}-config
  labels:
    {{- include "ledger-core.labels" . | nindent 4 }}
data:
  LEDGER_ENV: {{ .Values.env | quote }}
  LEDGER_LOG_LEVEL: {{ .Values.logLevel | quote }}
  LEDGER_KAFKA_BROKERS: {{ .Values.kafka.brokers | required "kafka.brokers is required" | quote }}
  LEDGER_POSTGRES_MAX_CONNS: {{ .Values.postgres.maxConns | quote }}
  LEDGER_POSTGRES_MIN_CONNS: {{ .Values.postgres.minConns | quote }}
  LEDGER_RECONCILER_PSP_CSV_PATH: {{ .Values.reconciler.pspCsvPath | quote }}
  # Every process here already refuses to enable it without also setting
  # this explicitly true, but stating the default here -- rather than
  # simply omitting the key -- is what makes a chart diff show exactly
  # what a values override to "true" is turning ON, the same reasoning
  # deploy/docker-compose.yml's own comment gives for restating it.
  LEDGER_FAULT_INJECTION_ENABLED: "false"
