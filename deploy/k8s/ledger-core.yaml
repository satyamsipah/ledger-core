apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-core-kafka-init
  labels:
    helm.sh/chart: ledger-core-0.1.0
    app.kubernetes.io/name: ledger-core
    app.kubernetes.io/instance: ledger-core
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # weight "1": after migration's "0". Provisioning the topic layout
    # does not depend on the schema, but running them concurrently buys
    # nothing and two hook Jobs racing to be "the" pre-install step is a
    # confusing failure to debug the one time one of them fails.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
